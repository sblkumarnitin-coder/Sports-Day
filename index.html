<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>BVM Sports Day - House Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #091b22; --surface: #102a33; --card: #153642;
    --border: rgba(151, 220, 210, 0.18);
    --text: #eefcf9; --muted: #9ac7c2;
    --gold: #2dd4bf; --gold-dim: rgba(45,212,191,0.16);
    --ekta: #20bf55; --sankalp: #e11d2f; --prayas: #157fbe; --vishwas: #f2c94c;
    --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --info: #3b82f6;
    --radius: 12px; --sidebar-w: 260px;
    --shadow-soft: 0 18px 44px rgba(0, 18, 24, 0.34);
  }
  body.light-theme {
    --bg: #f3fbf8; --surface: #ffffff; --card: #ffffff;
    --border: rgba(16, 82, 91, 0.16); --text: #10252b; --muted: #5b7e7d;
    --gold: #0f8f86; --gold-dim: rgba(15, 143, 134, 0.12);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, rgba(45,212,191,0.10), rgba(129,140,248,0.08)), var(--bg);
    color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.45;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 10px; }
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: linear-gradient(180deg, #102a33 0%, #0c2028 58%, #111d3b 100%);
    border-right: 1px solid var(--border);
    position: fixed; top: 0; left: 0; bottom: 0;
    display: flex; flex-direction: column; z-index: 200; overflow-y: auto;
  }
  body.light-theme .sidebar { background: linear-gradient(180deg, #ffffff 0%, #e7f8f4 48%, #edf0ff 100%); }
  .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-brand img { width: 48px; height: 48px; object-fit: contain; }
  .brand-text strong { font-family: 'Cinzel', serif; font-size: 17px; color: var(--gold); display: block; }
  .brand-text span { font-size: 12px; color: var(--muted); }
  .session-pill {
    margin: 16px; background: var(--gold-dim); border: 1px solid rgba(45,212,191,0.3);
    border-radius: 8px; padding: 8px; font-size: 12px; color: var(--gold); text-align: center;
  }
  .user-badge {
    margin: 8px 12px; background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.25); border-radius: 8px;
    padding: 10px 12px; display: none; align-items: center; justify-content: space-between;
  }
  .user-badge.visible { display: flex; }
  .logout-btn { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .nav { padding: 12px 0 20px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; margin: 3px 10px; cursor: pointer;
    font-size: 15px; color: var(--muted); border-radius: 10px; transition: all 0.2s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-item.active { color: var(--gold); background: var(--gold-dim); border-left: 3px solid var(--gold); }
  .nav-item .icon {
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px; background: rgba(45,212,191,0.14); color: var(--gold);
    box-shadow: inset 0 0 0 1px rgba(45,212,191,0.22);
  }
  .nav-item.active .icon, .nav-item:hover .icon { background: linear-gradient(135deg, #2dd4bf, #818cf8); color: #07181c; }
  .house-dots { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); margin-top: auto; }
  .house-dot { flex: 1; height: 4px; border-radius: 4px; cursor: pointer; opacity: 0.5; }
  .house-dot:hover { opacity: 1; transform: scaleY(2); }
  .house-dot.ekta { background: var(--ekta); }
  .house-dot.sankalp { background: var(--sankalp); }
  .house-dot.prayas { background: var(--prayas); }
  .house-dot.vishwas { background: var(--vishwas); }

  .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }
  .topbar {
    background: rgba(16,42,51,0.92); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  body.light-theme .topbar { background: rgba(255,255,255,0.92); }
  .topbar-title { font-family: 'Cinzel', serif; font-size: 18px; color: var(--text); font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .switcher {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  }
  .switcher-btn {
    border: none; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 8px 13px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .switcher-btn.active { background: linear-gradient(135deg, #2dd4bf, #818cf8); color: #07181c; }
  .topbar-badge { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: var(--gold-dim); color: var(--gold); }
  .mobile-menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }

  .page { display: none; padding: 32px 32px 128px; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .page-header { margin-bottom: 28px; }
  .page-header h1 {
    font-family: 'Cinzel', serif; font-size: 30px;
    background: linear-gradient(135deg, var(--text), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .page-header p { font-size: 14px; color: var(--muted); }

  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
    box-shadow: var(--shadow-soft);
  }
  .panel h3 { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
  .section-title {
    font-family: 'Cinzel', serif; font-size: 17px; color: var(--muted);
    margin-bottom: 18px; display: flex; align-items: center; gap: 12px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  .day-block { margin-bottom: 40px; }
  .day-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
    padding: 14px 20px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(45,212,191,0.15), rgba(129,140,248,0.08));
    border: 1px solid rgba(45,212,191,0.3);
  }
  .day-badge {
    font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700;
    padding: 6px 14px; border-radius: 10px;
    background: linear-gradient(135deg, #2dd4bf, #818cf8); color: #07181c;
  }
  .day-info { flex: 1; }
  .day-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; }
  .day-date { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .day-count { font-size: 12px; color: var(--muted); }

  .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .event-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    transition: all 0.2s; box-shadow: var(--shadow-soft);
  }
  .event-card:hover { border-color: rgba(45,212,191,0.4); transform: translateY(-2px); }
  .event-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .event-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

  .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-bottom: 8px; }
  .tag-upcoming { background: rgba(245,158,11,0.2); color: #fbbf24; }
  .tag-completed { background: rgba(16,185,129,0.2); color: #34d399; }
  .tag-suspended { background: rgba(239,68,68,0.2); color: #f87171; }
  .tag-live { background: rgba(45,212,191,0.2); color: #5eead4; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 14px; font-weight: 500;
    transition: all 0.2s; min-height: 40px;
    box-shadow: 0 10px 24px rgba(0,18,24,0.16);
  }
  .btn-primary { background: linear-gradient(135deg, #2dd4bf, #818cf8); color: #07181c; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.12); }
  body.light-theme .btn-secondary { background: rgba(15,143,134,0.10); color: #0f8f86; border-color: rgba(15,143,134,0.25); }
  .btn-success { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
  .btn-success:hover { background: var(--success); color: #fff; }
  .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 11px; min-height: 0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-size: 14px; outline: none; font-family: 'DM Sans', sans-serif;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
  .search-input { width: 100%; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }

  .data-table, .events-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th, .events-table th {
    padding: 12px; text-align: left; background: rgba(255,255,255,0.04);
    color: var(--muted); font-weight: 600; text-transform: uppercase;
    font-size: 11px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .data-table td, .events-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); }
  .data-table tr:hover td, .events-table tr:hover td { background: rgba(255,255,255,0.03); }
  body.light-theme .data-table th, body.light-theme .events-table th { background: rgba(15,143,134,0.08); }

  .alert {
    padding: 12px 16px; border-radius: 8px; font-size: 14px;
    margin: 12px 0; display: flex; align-items: center; gap: 10px;
  }
  .alert-success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }
  .alert-error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
  .alert-warning { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #fde68a; }
  .alert-info { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); color: #93c5fd; }

  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.9); z-index: 1000;
    align-items: center; justify-content: center; backdrop-filter: blur(8px);
  }
  .modal.open { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 90%; max-width: 480px; }
  .modal-box h2 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold); margin-bottom: 8px; }

  .student-pool { max-height: 400px; overflow-y: auto; }
  .student-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; margin: 4px 0; background: rgba(255,255,255,0.03);
    border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  }
  .student-row:hover { background: rgba(255,255,255,0.06); border-color: var(--border); }
  .student-row.selected { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.25); }
  .selected-pool { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 8px; }
  .selected-row { display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.03); margin: 4px 0; border-radius: 6px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 20px; display: flex;
    gap: 12px; z-index: 2000; animation: slideInRight 0.3s ease;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
  }
  @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .last-result {
    background:
      radial-gradient(circle at top, rgba(45,212,191,0.12), transparent 40%),
      linear-gradient(180deg, rgba(45,212,191,0.05), rgba(255,255,255,0.01));
    border: 1px solid rgba(45,212,191,0.25);
    border-radius: 20px; padding: 24px;
  }
  .last-result-title { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold); margin-bottom: 6px; text-align: center; }
  .last-result-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .place-row {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px; margin: 8px 0;
    border-radius: 12px; border: 1px solid var(--border); background: var(--card);
  }
  .place-row.first { background: linear-gradient(135deg, rgba(45,212,191,0.18), rgba(255,255,255,0.02)); border-color: rgba(45,212,191,0.4); }
  .place-row.second { background: linear-gradient(135deg, rgba(210,220,235,0.15), rgba(255,255,255,0.02)); }
  .place-row.third { background: linear-gradient(135deg, rgba(205,127,50,0.16), rgba(255,255,255,0.02)); }
  .place-row.fourth { background: rgba(255,255,255,0.02); opacity: 0.85; }
  .place-medal { font-size: 26px; }
  .place-label { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .place-house { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; }
  .place-pts { margin-left: auto; font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold); }

  .house-group {
    margin-bottom: 20px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); background: rgba(255,255,255,0.02);
  }
  .house-group-head {
    padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
  }
  .house-group-head .dot { width: 16px; height: 16px; border-radius: 50%; }
  .house-group-head .count { margin-left: auto; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); font-weight: 500; }

  .cert-preview-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px; margin-top: 16px;
  }
  .cert-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow-soft);
  }
  .cert-card .medal { font-size: 26px; margin-bottom: 4px; }
  .cert-card .name { font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700; }
  .cert-card .meta { font-size: 12px; color: var(--muted); }
  .cert-card .actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ── CERTIFICATE DESIGNER ── */
  .designer-wrap {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px;
    align-items: flex-start;
  }
  @media (max-width: 1100px) { .designer-wrap { grid-template-columns: 1fr; } }

  .designer-canvas {
    position: relative; width: 100%; max-width: 900px;
    background: #fff; border: 2px dashed rgba(45,212,191,0.4);
    border-radius: 12px; overflow: hidden; user-select: none;
  }
  .designer-canvas img { width: 100%; display: block; pointer-events: none; }
  .designer-canvas .no-img {
    width: 100%; aspect-ratio: 1.4/1;
    background: linear-gradient(135deg, #fff9ec, #f4e8c8);
    display: flex; align-items: center; justify-content: center;
    color: #8b7a5c; font-family: Georgia, serif; font-size: 18px;
  }

  .designer-field {
    position: absolute;
    cursor: grab;
    padding: 4px 8px;
    border: 1.5px dashed rgba(45,212,191,0.7);
    background: rgba(45,212,191,0.10);
    border-radius: 6px;
    color: #0a0a0a;
    white-space: nowrap;
    font-family: Georgia, serif;
    transform: translate(-50%, -50%);
    user-select: none;
    z-index: 5;
    transition: background 0.15s;
  }
  .designer-field:hover { background: rgba(45,212,191,0.22); }
  .designer-field.active {
    background: rgba(45,212,191,0.30);
    border: 2px solid #0f8f86;
    box-shadow: 0 0 0 3px rgba(45,212,191,0.2);
    z-index: 10;
  }
  .designer-field.dragging { cursor: grabbing; }

  .designer-controls { display: flex; flex-direction: column; gap: 14px; }
  .designer-field-btn {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .designer-field-btn:hover { background: rgba(45,212,191,0.10); }
  .designer-field-btn.active { background: linear-gradient(135deg, #2dd4bf, #818cf8); color: #07181c; border-color: transparent; }

  .designer-coord {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .designer-coord .form-group label { font-size: 11px; }

  /* Fix typing experience inside fields when editing text */
  .designer-field input {
    border: none; background: transparent; color: inherit; font: inherit;
    outline: none; width: 100%; text-align: inherit;
  }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); transition: transform 0.2s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-menu-btn { display: block; }
    .page { padding: 20px; }
    .topbar { padding: 0 16px; height: auto; min-height: 60px; flex-wrap: wrap; gap: 10px; }
    .topbar-right { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="https://ik.imagekit.io/flr6iuzhm/bvm_logo-removebg-preview.png" alt="BVM Logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <strong>BVM SAMBHAL</strong>
        <span>Sports Day Championship</span>
      </div>
    </div>
    <div class="session-pill" id="sessionPill">SPORTS DAY 2026</div>
    <div class="user-badge" id="userBadge">
      <span id="userBadgeName">—</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="showPage('home')"><span class="icon">🏆</span> Home</div>
      <div class="nav-item" onclick="showEventsByFilter('all')"><span class="icon">📅</span> All Events</div>
      <div class="nav-item" onclick="showParticipantsPublic()"><span class="icon">👥</span> Participants</div>
      <div class="nav-item" onclick="showResultsPointsWise()"><span class="icon">📊</span> Points Wise</div>
      <div class="nav-item" onclick="showCertificateCenter()"><span class="icon">🎓</span> E-Certificates</div>
      <div class="nav-item" onclick="showAdminLogin()"><span class="icon">⚙️</span> Admin</div>
    </nav>
    <div class="house-dots">
      <div class="house-dot ekta" onclick="showHouseGallery('ekta')"></div>
      <div class="house-dot sankalp" onclick="showHouseGallery('sankalp')"></div>
      <div class="house-dot prayas" onclick="showHouseGallery('prayas')"></div>
      <div class="house-dot vishwas" onclick="showHouseGallery('vishwas')"></div>
    </div>
  </aside>

  <main class="main">

async function saveCertSetting(key, value) {
  if(!db) return { error: 'DB not connected' };
  try {
    const { data: existing } = await db.from('sports_settings').select('id').eq('key', key).limit(1);
    if(existing && existing.length) {
      const { error } = await db.from('sports_settings').update({ value, updated_at: new Date().toISOString() }).eq('key', key);
      return { error: error?.message || null };

      return { error: error?.message || null };
    }
  } catch(e) { return { error: e.message }; }
}

function compressImageDataUrl(dataUrl, maxWidth = 1600, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ═══════════════════════════════════════════════════════════════

function esc(s) { if(s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizeText(v) { return String(v || '').trim().toLowerCase(); }
function normalizeAdmissionNo(v) {
  const raw = String(v ?? '').trim();
  if(!raw) return '';
  if(typeof v === 'number' && Number.isFinite(v)) return String(Math.trunc(v));
  if(/^\d+\.0+$/.test(raw)) return raw.replace(/\.0+$/, '');
  return raw.replace(/\D/g, '');
}
function admissionLookupKey(v) { return normalizeAdmissionNo(v) || normalizeText(v).replace(/\s+/g,''); }
function houseKey(name) {
  if(!name) return '';
  const raw = normalizeText(name);
  const compact = raw.replace(/[^a-z]/g, '');
  return Object.keys(HOUSE_META).find(k => {
    const canonical = normalizeText(HOUSE_META[k].name);
    const canonicalCompact = canonical.replace(/[^a-z]/g, '');
    return canonical === raw || raw === k || raw.includes(k) || compact === canonicalCompact || compact === k;
  }) || '';
}
function canonicalHouseName(name) {
  if(!name) return '';
  const key = houseKey(String(name).trim());
  return HOUSE_META[key]?.name || String(name).trim();
}
function parseHousePositionValue(value) {
  const seen = new Set();
  return String(value || '').split(',').map(i => canonicalHouseName(i.trim())).filter(Boolean).filter(i => { if(seen.has(i)) return false; seen.add(i); return true; });
}
function compareAscending(a, b) { return String(a||'').localeCompare(String(b||''), undefined, { numeric: true, sensitivity: 'base' }); }
function normalizeClassValue(v) {
  const raw = String(v||'').trim().toUpperCase();
  const map = { I:1, II:2, III:3, IV:4, V:5, VI:6, VII:7, VIII:8, IX:9, X:10, XI:11, XII:12 };
  if(map[raw] !== undefined) return map[raw];
  const n = parseInt(raw.replace(/[^\d]/g,''), 10);
  return !isNaN(n) ? n : Number.MAX_SAFE_INTEGER;
}
function compareClassAscending(a, b) {
  const an = normalizeClassValue(a), bn = normalizeClassValue(b);
  return an !== bn ? an - bn : compareAscending(a, b);
}
function compareStudentsAscending(a = {}, b = {}) {
  return compareClassAscending(a.class, b.class) || compareAscending(a.section, b.section) ||
         compareAscending(a.roll_no || a.roll, b.roll_no || b.roll) ||
         compareAscending(a.admission_no, b.admission_no) ||
         compareAscending(a.student_name || a.name, b.student_name || b.name);
}
function sortStudentsAscending(list = []) { return [...list].sort(compareStudentsAscending); }
function sortEventsAscending(list = []) {

}

async function loadStudents() {
  if(!db) return;
  try {
    const batchSize = 1000;
    let from = 0, fetched = [];
    while(true) {
      const { data, error } = await db.from('students').select('*').order('student_name', { ascending: true }).range(from, from + batchSize - 1);
      if(error) throw error;
      const batch = data || [];
      fetched = fetched.concat(batch);
      if(batch.length < batchSize) break;
      from += batchSize;
    }
    allStudents = sortStudentsAscending(fetched);
  } catch(e) { console.error('loadStudents error:', e); }
}

async function loadEvents() {
  if(!db) return;
  try {
    await loadResults();
    const { data, error } = await db.from('sports_events').select('*').order('event_date', { ascending: true });
    if(error) throw error;
    allEvents = sortEventsAscending(data || []);
    renderHome();
  } catch(e) { console.error('loadEvents error:', e); }
}

async function loadResults() {
  if(!db) return;
  const { data, error } = await db.from('sports_results').select('*').order('created_at', { ascending: false });
  if(error) { console.error('loadResults error:', error); return; }
  allResults = data || [];
  refreshHousePoints();
}

function refreshHousePoints() {
  const totals = defaultHousePoints();
  allResults.forEach(r => {
    let noteData = null;
    try { noteData = r.notes ? JSON.parse(r.notes) : null; } catch {}
    const pts = noteData?.points || PLACE_POINTS;
    parseHousePositionValue(r.first_place).forEach(h  => { if(totals[h] !== undefined) totals[h] += (pts.first_place  ?? 5); });
    parseHousePositionValue(r.second_place).forEach(h => { if(totals[h] !== undefined) totals[h] += (pts.second_place ?? 3); });
    parseHousePositionValue(r.third_place).forEach(h  => { if(totals[h] !== undefined) totals[h] += (pts.third_place  ?? 1); });
    parseHousePositionValue(r.fourth_place).forEach(h => { if(totals[h] !== undefined) totals[h] += (pts.fourth_place ?? 0); });
  });
  housePts = totals;
}

function hasResultForEvent(eventId) {
  const id = parseInt(eventId, 10);
  return allResults.some(r => parseInt(r.event_id, 10) === id);
}

function isEventPassed(event) {
  if(!event || event.status === 'suspended') return false;
  if(hasResultForEvent(event.id)) return true;
  return !!(event.event_date && new Date(event.event_date) < new Date());
}

    const cards = events.map(e => {
      const status = e.status === 'suspended' ? 'Suspended'
                    : hasResultForEvent(e.id) ? 'Result Declared'
                    : isEventPassed(e) ? 'Completed'
                    : 'Upcoming';
      const tagCls = status === 'Suspended' ? 'tag-suspended'
                    : (status === 'Completed' || status === 'Result Declared') ? 'tag-completed'
                    : 'tag-upcoming';
      let resultHtml = '';
      if(hasResultForEvent(e.id)) {
        const r = allResults.find(x => parseInt(x.event_id, 10) === e.id);
        if(r) {
          const f = parseHousePositionValue(r.first_place).join(', ');
          const s = parseHousePositionValue(r.second_place).join(', ');
          const t = parseHousePositionValue(r.third_place).join(', ');
          const fo = parseHousePositionValue(r.fourth_place).join(', ');

            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
              <div class="meta" style="color:var(--gold);font-weight:600;">🏆 Result Declared</div>
              <div class="meta">🥇 ${esc(f || '—')}</div>
              <div class="meta">🥈 ${esc(s || '—')}</div>
              <div class="meta">🥉 ${esc(t || '—')}</div>
              <div class="meta">4️⃣ ${esc(fo || '—')}</div>
            </div>`;
        }

      return `<div class="event-card">
        <span class="tag ${tagCls}">${status}</span>
        <h3>${esc(e.event_name)}</h3>
        <div class="meta">📚 ${esc(e.for_class || 'All classes')}</div>
        <div class="meta">📅 ${esc(formatDate(e.event_date))}</div>
        <div class="meta">👥 ${esc(e.participants || 'Any')} participant(s)</div>
        ${e.gender ? `<div class="meta">👤 ${esc(e.gender)}</div>` : ''}
        ${e.category ? `<div class="meta">🏷️ ${esc(e.category)}</div>` : ''}
        ${resultHtml}
      </div>`;
    }).join('');

    return `
      <div class="day-block">
        <div class="day-head">
          <div class="day-badge">Day ${dayNum}</div>
          <div class="day-info">
            <div class="day-title">Sports Day — Day ${dayNum}</div>
            <div class="day-date">${esc(formatDate(dateStr))}</div>
          </div>
          <div class="day-count">${events.length} event(s)</div>

      </div>`;
  };

function renderHomePointsWise() {
  const el = document.getElementById('homePointsWise');
  if(!el) return;
  if(!allResults.length) {
    el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);">No results recorded yet.</div>`;
    return;
  }
  const houseColors = HOUSE_ORDER.map(h => HOUSE_META[houseKey(h)]?.color || '#fff');
  const houseTotals = Object.fromEntries(HOUSE_ORDER.map(h => [h, 0]));
  const rows = allResults.map(r => {
    let noteData = null;
    try { noteData = r.notes ? JSON.parse(r.notes) : null; } catch {}
    const pts = noteData?.points || PLACE_POINTS;
    const cells = HOUSE_ORDER.map(h => {
      let val = '—';
      if(parseHousePositionValue(r.first_place).includes(h))  { val = pts.first_place  ?? 5; houseTotals[h] += val; }
      else if(parseHousePositionValue(r.second_place).includes(h)) { val = pts.second_place ?? 3; houseTotals[h] += val; }
      else if(parseHousePositionValue(r.third_place).includes(h))  { val = pts.third_place  ?? 1; houseTotals[h] += val; }
      else if(parseHousePositionValue(r.fourth_place).includes(h)) { val = pts.fourth_place ?? 0; houseTotals[h] += val; }
      const isTop = val === 5;
      return `<td style="text-align:center;font-size:15px;font-weight:${isTop?'700':'400'};color:${isTop?'var(--gold)':'var(--text)'};">${val}</td>`;
    }).join('');
    return `<tr><td><strong>${esc(r.event_name || 'Event')}</strong></td>${cells}</tr>`;
  }).join('');
  const maxPts = Math.max(...Object.values(houseTotals), 1);
  const totalCells = HOUSE_ORDER.map((h, i) => {
    const total = houseTotals[h];
    const isWinner = total === maxPts && total > 0;
    return `<td style="text-align:center;font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:${isWinner?'var(--gold)':houseColors[i]};background:${isWinner?'var(--gold-dim)':'transparent'};padding:14px;">${total} ${isWinner?'🏆':''}</td>`;
  }).join('');
  el.innerHTML = `
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="background:var(--surface);">
            <th style="padding:12px 14px;text-align:left;border-bottom:2px solid var(--gold);color:var(--muted);font-size:11px;text-transform:uppercase;min-width:200px;">Event</th>
            ${HOUSE_ORDER.map((h,i) => `<th style="padding:12px 14px;text-align:center;border-bottom:2px solid ${houseColors[i]};color:${houseColors[i]};font-size:12px;min-width:120px;">${esc(h)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr style="border-top:2px solid var(--gold);">
            <td style="padding:14px;font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--gold);">TOTAL POINTS</td>
            ${totalCells}
          </tr>
        </tbody>
      </table>
    </div>`;
}

  let noteData = null;
  try { noteData = last.notes ? JSON.parse(last.notes) : null; } catch {}
  const pts = noteData?.points || PLACE_POINTS;

  let participants = [];
  try {
    const { data } = await db.from('sports_participants').select('*').eq('event_id', eid);
    participants = data || [];
  } catch(e) { console.warn(e); }

  const placeRows = [
    { key: 'first_place',  label: 'First Place',  medal: '🥇', cls: 'first'  },
    { key: 'second_place', label: 'Second Place', medal: '🥈', cls: 'second' },
    { key: 'third_place',  label: 'Third Place',  medal: '🥉', cls: 'third'  },
    { key: 'fourth_place', label: 'Fourth Place', medal: '4️⃣', cls: 'fourth' }
  ].map(p => {
    const houseStr = last[p.key] || '';
    const houses = houseStr ? parseHousePositionValue(houseStr) : [];
    const ptsVal = pts[p.key] ?? PLACE_POINTS[p.key];
    const houseList = houses.length
      ? houses.map(h => {
          const meta = HOUSE_META[houseKey(h)] || { color: 'var(--muted)' };
          return `<span style="color:${meta.color};font-weight:700;">${esc(h)}</span>`;
        }).join(', ')
      : `<span style="color:var(--muted);font-style:italic;">—</span>`;
    return `<div class="place-row ${p.cls}">
      <span class="place-medal">${p.medal}</span>
      <div>
        <div class="place-label">${p.label}</div>
        <div class="place-house">${houseList}</div>
      </div>
      <span class="place-pts">+${ptsVal} pts</span>
    </div>`;
  }).join('');

  const participantRows = sortStudentsAscending(participants).map((p, i) => {
    let declared = '—';
    const house = canonicalHouseName(p.house);
    if(parseHousePositionValue(last.first_place).includes(house)) declared = '🥇 First Place';
    else if(parseHousePositionValue(last.second_place).includes(house)) declared = '🥈 Second Place';
    else if(parseHousePositionValue(last.third_place).includes(house)) declared = '🥉 Third Place';
    else if(parseHousePositionValue(last.fourth_place).includes(house)) declared = '4️⃣ Fourth Place';
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(p.admission_no || '—')}</td>
      <td><strong>${esc(p.student_name || '—')}</strong></td>
      <td>${esc(p.class || '—')}</td>
      <td>${esc(p.section || '—')}</td>
      <td style="color:${HOUSE_META[houseKey(p.house)]?.color || 'var(--text)'}">${esc(p.house || '—')}</td>
      <td>${declared}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="last-result">
      <div class="last-result-title">🏁 ${esc(last.event_name || 'Sports Event')}</div>
      <div class="last-result-sub">
        ${event?.event_date ? '📅 ' + esc(formatDate(event.event_date)) : ''}
        ${event?.for_class ? ' · 📚 Class ' + esc(event.for_class) : ''}
        ${event?.gender ? ' · ' + esc(event.gender) : ''}
      </div>
      <div style="margin-bottom:20px;">${placeRows}</div>
      ${participantRows ? `
        <div style="margin-top:24px;">
          <div style="font-family:'Cinzel',serif;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Participant Details — ${participants.length} student(s)</div>
          <div style="overflow-x:auto;">
            <table class="events-table">
              <thead>
                <tr><th>#</th><th>Admission No</th><th>Name</th><th>Class</th><th>Section</th><th>House</th><th>Result</th></tr>
              </thead>
              <tbody>${participantRows}</tbody>
            </table>
          </div>
        </div>` : ''}
    </div>`;
}

function showEventsByFilter(filter) {
  let list = [...allEvents];
  let title = 'All Events';
  if(filter === 'upcoming') { list = list.filter(e => !isEventPassed(e) && e.status !== 'suspended'); title = 'Upcoming Events'; }
  if(filter === 'passed')   { list = list.filter(e => isEventPassed(e)); title = 'Completed Events'; }

  const day1 = list.filter(e => e.event_date === SPORTS_DAY_1);
  const day2 = list.filter(e => e.event_date === SPORTS_DAY_2);
  const other = list.filter(e => !e.event_date || (e.event_date !== SPORTS_DAY_1 && e.event_date !== SPORTS_DAY_2));

  const renderGroup = (dayNum, dateStr, events) => {
    if(!events.length) return '';
    const cards = events.map(e => {
      const status = e.status === 'suspended' ? 'Suspended'
                    : hasResultForEvent(e.id) ? 'Result Declared'
                    : isEventPassed(e) ? 'Completed'
                    : 'Upcoming';
      const tagCls = status === 'Suspended' ? 'tag-suspended'
                    : (status === 'Completed' || status === 'Result Declared') ? 'tag-completed'
                    : 'tag-upcoming';
      let resultHtml = '';
      if(hasResultForEvent(e.id)) {
        const r = allResults.find(x => parseInt(x.event_id, 10) === e.id);
        if(r) {
          const f = parseHousePositionValue(r.first_place).join(', ');
          const s = parseHousePositionValue(r.second_place).join(', ');
          const t = parseHousePositionValue(r.third_place).join(', ');
          const fo = parseHousePositionValue(r.fourth_place).join(', ');
          resultHtml = `
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
              <div class="meta" style="color:var(--gold);font-weight:600;">🏆 Result Declared</div>
              <div class="meta">🥇 ${esc(f || '—')}</div>
              <div class="meta">🥈 ${esc(s || '—')}</div>
              <div class="meta">🥉 ${esc(t || '—')}</div>
              <div class="meta">4️⃣ ${esc(fo || '—')}</div>
            </div>`;
        }
      }
      return `<div class="event-card">
        <span class="tag ${tagCls}">${status}</span>
        <h3>${esc(e.event_name)}</h3>
        <div class="meta">📚 ${esc(e.for_class || 'All classes')}</div>
        <div class="meta">📅 ${esc(formatDate(e.event_date))}</div>
        <div class="meta">👥 ${esc(e.participants || 'Any')} participant(s)</div>
        ${e.gender ? `<div class="meta">👤 ${esc(e.gender)}</div>` : ''}
        ${e.category ? `<div class="meta">🏷️ ${esc(e.category)}</div>` : ''}
        ${resultHtml}
      </div>`;
    }).join('');

    return `
      <div class="day-block">
        <div class="day-head">
          <div class="day-badge">Day ${dayNum}</div>
          <div class="day-info">
            <div class="day-title">Sports Day — Day ${dayNum}</div>
            <div class="day-date">${esc(formatDate(dateStr))}</div>
          </div>
          <div class="day-count">${events.length} event(s)</div>
        </div>
        <div class="events-grid">${cards}</div>
      </div>`;
  };

  const page = document.getElementById('page-dynamic');
  page.innerHTML = `
    <div class="page-header"><h1>${title}</h1><p>${list.length} event(s)</p></div>
    ${renderGroup(1, SPORTS_DAY_1, day1)}
    ${renderGroup(2, SPORTS_DAY_2, day2)}
    ${other.length ? `
      <div class="day-block">
        <div class="day-head">
          <div class="day-badge">+</div>
          <div class="day-info">
            <div class="day-title">Other Events</div>
            <div class="day-date">Events on other dates</div>
          </div>
          <div class="day-count">${other.length} event(s)</div>
        </div>
        <div class="events-grid">${other.map(e => `<div class="event-card"><h3>${esc(e.event_name)}</h3><div class="meta">📅 ${esc(e.event_date || 'TBD')}</div></div>`).join('')}</div>
      </div>` : ''}
    ${(!day1.length && !day2.length && !other.length) ? '<div class="panel" style="text-align:center;color:var(--muted);padding:40px;">No events found.</div>' : ''}
    <button class="btn btn-secondary" style="margin-top:20px" onclick="showPage('home','🏆 Sports Day Championship')">← Back</button>`;
  showPage('dynamic', title);
}

function initAdminParticipantsTab() {
  adminSelectedEventId = null;
  adminSelectedHouse = '';
  adminSelectedStudents = [];
  adminRegisteredAdmissions = [];
}

async function onAdminPartEventChange() {
  const sel = document.getElementById('adminPartEvent');
  adminSelectedEventId = sel.value ? parseInt(sel.value, 10) : null;
  adminSelectedStudents = [];
  updateAdminSelectedPool();
  const info = document.getElementById('adminPartEventInfo');
  if(!adminSelectedEventId) { info.innerHTML = ''; document.getElementById('adminPartStudentPanel').style.display = 'none'; return; }
  const event = allEvents.find(e => e.id === adminSelectedEventId);
  info.innerHTML = `
    <div class="alert alert-info" style="margin-top:16px;">
      <strong>${esc(event.event_name)}</strong> · ${event.event_date ? '📅 ' + esc(formatDate(event.event_date)) : 'TBD'} · 👥 ${esc(event.participants || 'any')} participant(s) per house
    </div>`;
  if(adminSelectedHouse) {
    await loadAdminRegistered();
    document.getElementById('adminPartStudentPanel').style.display = 'block';
    filterAdminStudents();
  }
}

async function onAdminPartHouseChange() {
  adminSelectedHouse = document.getElementById('adminPartHouse').value;
  adminSelectedStudents = [];
  document.getElementById('adminPartHouseLabel').textContent = adminSelectedHouse || '—';
  updateAdminSelectedPool();
  if(!adminSelectedEventId || !adminSelectedHouse) { document.getElementById('adminPartStudentPanel').style.display = 'none'; return; }
  await loadAdminRegistered();
  document.getElementById('adminPartStudentPanel').style.display = 'block';
  filterAdminStudents();
}

async function loadAdminRegistered() {
  if(!adminSelectedEventId) return;
  const { data } = await db.from('sports_participants').select('admission_no').eq('event_id', adminSelectedEventId).eq('house', adminSelectedHouse);
  adminRegisteredAdmissions = (data || []).map(r => admissionLookupKey(r.admission_no));
}

function filterAdminStudents() {
  const q = normalizeText(document.getElementById('adminPartSearch')?.value || '');
  const qAdm = normalizeAdmissionNo(q);
  const container = document.getElementById('adminPartPool');
  if(!container) return;
  if(!adminSelectedEventId || !adminSelectedHouse) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);">Select event and house first</div>`;
    return;
  }
  const canonHouse = canonicalHouseName(adminSelectedHouse);
  let pool = allStudents.filter(s => {
    const sHouse = canonicalHouseName(s.house || '');
    if(sHouse !== canonHouse) return false;
    if(!q) return true;
    const name = normalizeText(s.student_name);
    const adm = normalizeText(s.admission_no);
    const admDigits = normalizeAdmissionNo(s.admission_no);
    return name.includes(q) || adm.includes(q) || (qAdm && admDigits.includes(qAdm));
  });
  if(!pool.length) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);">No students found for ${esc(adminSelectedHouse)}</div>`;
    return;
  }
  container.innerHTML = pool.map(s => {
    const isSel = adminSelectedStudents.some(x => x.id === s.id);
    const already = adminRegisteredAdmissions.includes(admissionLookupKey(s.admission_no));
    return `<div class="student-row ${isSel?'selected':''} ${already?'selected':''}" onclick="toggleAdminStudent(${s.id}, ${already})">
      <div>
        <div><strong>${esc(s.student_name)}</strong></div>
        <div class="meta" style="font-size:11px;color:var(--muted);">#${esc(s.admission_no)} · Class ${esc(s.class)}-${esc(s.section)}${s.gender ? ' · ' + esc(s.gender) : ''}</div>
        <div class="meta" style="font-size:10px;color:${already?'var(--success)':'var(--muted)'}">${already?'✅ Already registered':`🏠 ${esc(s.house)}`}</div>
      </div>
      <span>${already?'✅':isSel?'✅':'○'}</span>
    </div>`;
  }).join('');
}

function toggleAdminStudent(id, already) {
  if(already) { showToast('Already registered for this event', 'warning'); return; }
  const s = allStudents.find(x => x.id === id);
  if(!s) return;
  const idx = adminSelectedStudents.findIndex(x => x.id === id);
  if(idx === -1) adminSelectedStudents.push(s);
  else adminSelectedStudents.splice(idx, 1);
  updateAdminSelectedPool();
  filterAdminStudents();
}

function updateAdminSelectedPool() {
  const el = document.getElementById('adminPartSelected');
  const cnt = document.getElementById('adminPartSelectedCount');
  if(!el || !cnt) return;
  cnt.textContent = adminSelectedStudents.length;
  if(!adminSelectedStudents.length) { el.innerHTML = `<div style="padding:16px;text-align:center;color:var(--muted);">No students selected</div>`; return; }
  el.innerHTML = adminSelectedStudents.map(s => `
    <div class="selected-row">
      <div><strong>${esc(s.student_name)}</strong> · ${esc(s.admission_no)} · ${esc(s.class)}-${esc(s.section)} · 🏠 ${esc(s.house)}</div>
      <button onclick="toggleAdminStudent(${s.id}, false)" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
}

function resetAdminParticipantSelection() {
  adminSelectedStudents = [];
  updateAdminSelectedPool();
  filterAdminStudents();
}

async function registerAdminParticipants() {
  if(!adminSelectedEventId || !adminSelectedHouse) { showToast('Select event and house', 'error'); return; }
  if(!adminSelectedStudents.length) { showToast('Select at least one student', 'error'); return; }
  const event = allEvents.find(e => e.id === adminSelectedEventId);
  const rows = adminSelectedStudents
    .filter(s => !adminRegisteredAdmissions.includes(admissionLookupKey(s.admission_no)))
    .map(s => ({
      event_id: adminSelectedEventId,
      admission_no: s.admission_no,
      student_name: s.student_name,
      class: s.class,
      section: s.section,
      house: s.house,
      registered_by: adminSelectedHouse,
      registered_at: new Date().toISOString()
    }));
  if(!rows.length) { showToast('No new students to register', 'warning'); return; }
  const { error } = await db.from('sports_participants').insert(rows);
  if(error) { document.getElementById('adminPartStatus').innerHTML = `<div class="alert alert-error">${esc(error.message)}</div>`; return; }
  document.getElementById('adminPartStatus').innerHTML = `<div class="alert alert-success">✅ Registered ${rows.length} student(s) from ${esc(adminSelectedHouse)} for ${esc(event.event_name)}.</div>`;
  showToast(`Registered ${rows.length} participant(s)`, 'success');
  adminSelectedStudents = [];
  updateAdminSelectedPool();
  await loadAdminRegistered();
  filterAdminStudents();
}

function onAdminViewEventChange() {
  adminViewEventFilter = document.getElementById('adminViewEvent')?.value || '';
  loadAdminRegisteredList();
}

async function loadAdminRegisteredList() {
  const el = document.getElementById('adminRegisteredList');
  if(!el) return;
  try {
    let query = db.from('sports_participants').select('*');
    if(adminViewEventFilter) query = query.eq('event_id', parseInt(adminViewEventFilter, 10));
    const { data, error } = await query;
    if(error) throw error;
    const rows = data || [];
    _adminRegisteredCache = rows;
    if(!rows.length) { el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);">No participants found.</div>`; return; }

    const byEvent = {};
    rows.forEach(r => {
      const eid = String(r.event_id);
      if(!byEvent[eid]) byEvent[eid] = { event_id: eid, rows: [] };
      byEvent[eid].rows.push(r);
    });
    Object.values(byEvent).forEach(g => {
      const ev = allEvents.find(e => String(e.id) === String(g.event_id));
      g.event_name = ev ? ev.event_name : (g.rows[0]?.event_name || 'Unknown Event');
      g.event_date = ev?.event_date || '';
    });

    const groupKeys = Object.keys(byEvent).sort((a,b) => {
      const ea = byEvent[a], eb = byEvent[b];
      return compareAscending(ea.event_date, eb.event_date) || compareAscending(ea.event_name, eb.event_name);
    });

    let html = '';
    groupKeys.forEach(key => {
      const g = byEvent[key];
      html += `<div style="margin-bottom:28px;">`;
      html += `<div style="font-family:'Cinzel',serif;font-size:17px;color:var(--gold);font-weight:700;margin-bottom:4px;">${esc(g.event_name)}</div>`;
      html += `<div style="font-size:12px;color:var(--muted);margin-bottom:14px;">${esc(getDayLabel(g.event_date))}${g.event_date ? ' · ' + esc(formatDate(g.event_date)) : ''} · ${g.rows.length} participant(s)</div>`;

      HOUSE_ORDER.forEach(house => {
        const houseRows = sortStudentsAscending(g.rows.filter(r => canonicalHouseName(r.house) === house));
        if(!houseRows.length) return;
        const meta = HOUSE_META[houseKey(house)] || { color: '#999' };
        html += `<div class="house-group">`;
        html += `<div class="house-group-head" style="background:${meta.color}22;color:${meta.color};border-bottom:1px solid ${meta.color}55;">`;
        html += `<span class="dot" style="background:${meta.color};"></span>${esc(house)}`;
        html += `<span class="count">${houseRows.length} student(s)</span>`;
        html += `</div>`;
        html += `<div style="overflow-x:auto;">`;
        html += `<table class="events-table"><thead><tr>
          <th>#</th><th>Adm No</th><th>Roll No</th><th>Name</th><th>Class</th><th>Section</th><th>House</th><th>Action</th>
        </tr></thead><tbody>`;
        houseRows.forEach((r, i) => {
          const linked = allStudents.find(s => admissionLookupKey(s.admission_no) === admissionLookupKey(r.admission_no)) || {};
          html += `<tr>
            <td>${i+1}</td>
            <td>${esc(r.admission_no || '—')}</td>
            <td>${esc(linked.roll_no || linked.roll || '—')}</td>
            <td><strong>${esc(r.student_name || '—')}</strong></td>
            <td>${esc(r.class || '—')}</td>
            <td>${esc(r.section || '—')}</td>
            <td style="color:${meta.color};font-weight:600;">${esc(r.house || '—')}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteSportsParticipant(${r.id})">Delete</button></td>
          </tr>`;
        });
        html += `</tbody></table></div></div>`;
      });

      html += `</div>`;
    });

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">Could not load: ${esc(e.message)}</div>`;
  }
}

function printAdminParticipantList() {
  if(!_adminRegisteredCache.length) { showToast('No participants to print.', 'warning'); return; }
  const byEvent = {};
  _adminRegisteredCache.forEach(r => {
    const eid = String(r.event_id);
    if(!byEvent[eid]) byEvent[eid] = { rows: [] };
    byEvent[eid].rows.push(r);
  });
  const groupKeys = Object.keys(byEvent).sort((a,b) => {
    const ea = allEvents.find(e => String(e.id) === String(a));
    const eb = allEvents.find(e => String(e.id) === String(b));
    return compareAscending(ea?.event_date, eb?.event_date) || compareAscending(ea?.event_name, eb?.event_name);
  });

  let bodyHtml = '';
  groupKeys.forEach(key => {
    const g = byEvent[key];
    const ev = allEvents.find(e => String(e.id) === String(key));

      houseRows.forEach((r, i) => {

        bodyHtml += `<tr>
          <td style="border:1px solid #777;padding:5px 7px;font-size:11px;text-align:center;">${i+1}</td>

  const win = window.open('', '_blank', 'width=1100,height=800');

async function verifyPasswordFromDatabase(role, name, pwd) {
  if(!db) { showToast('DB not connected', 'error'); return null; }

    let q = db.from(AUTH_TABLE).select('*').eq(AUTH_ROLE_COLUMN, role);
    if(role === 'admin') q = q.ilike(AUTH_NAME_COLUMN, 'admin');
    const { data, error } = await q.limit(1);

    return !!rec && String(rec[AUTH_PASSWORD_COLUMN] || '') === String(pwd || '');

  const choice = prompt(
    `Change date for "${ev.event_name}"\n\nEnter 1 for Day 1 (${formatDate(SPORTS_DAY_1)})\nEnter 2 for Day 2 (${formatDate(SPORTS_DAY_2)})\nOr type a full date YYYY-MM-DD`,

function expandHouseShortcut(token) {
  const raw = String(token || '').trim();
  if(!raw) return '';
  const k = raw.toLowerCase();
  if(k === 'e') return 'Ekta House';
  if(k === 's') return 'Sankalp House';
  if(k === 'p') return 'Prayas House';
  if(k === 'v') return 'Vishwas House';
  return canonicalHouseName(raw) || raw;
}
function expandHouseInput(value) {
  const raw = String(value || '');
  const endsWithComma = /,\s*$/.test(raw);
  const parts = raw.split(',');
  const expanded = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    const t = p.trim();
    if(!t) return '';
    if(isLast && !endsWithComma) {
      const k = t.toLowerCase();
      if(['e','s','p','v'].includes(k)) return expandHouseShortcut(t);
      return p.replace(/^\s+/, '');
    }
    return expandHouseShortcut(t);
  });
  let result = expanded.map((p, i) => p ? (i === 0 ? p : ` ${p}`) : '').join(',');
  if(endsWithComma) result = result.replace(/\s*$/, '') + ', ';
  return result;
}
function applyHouseShortcutInput(id) {
  const el = document.getElementById(id);
  if(!el) return;
  const expanded = expandHouseInput(el.value);
  if(el.value !== expanded) el.value = expanded;
}

async function addSportsResult() {
  const eid = parseInt(document.getElementById('resEvent').value, 10);
  if(!eid) { showToast('Select an event', 'error'); return; }
  if(hasResultForEvent(eid)) { showToast('Result already saved', 'error'); return; }
  const event = allEvents.find(e => e.id === eid);

  const first  = parseHousePositionValue(document.getElementById('resFirst').value).join(', ');
  const second = parseHousePositionValue(document.getElementById('resSecond').value).join(', ');
  const third  = parseHousePositionValue(document.getElementById('resThird').value).join(', ');
  const notes  = document.getElementById('resNotes').value.trim();

  if(!first)  { showToast('Enter First place house', 'error'); return; }
  if(!second) { showToast('Enter Second place house', 'error'); return; }
  if(!third)  { showToast('Enter Third place house', 'error'); return; }

  const all = [...parseHousePositionValue(first), ...parseHousePositionValue(second), ...parseHousePositionValue(third)];
  const dup = all.find((h, i) => all.indexOf(h) !== i);
  if(dup) { showToast(`House "${dup}" repeated across positions`, 'error'); return; }

  const fourth = HOUSE_ORDER.filter(h => !all.includes(h)).join(', ');

  const payload = {
    event_id: eid,
    event_name: event.event_name,
    winner_house: first,
    first_place: first,
    second_place: second,
    third_place: third,
    fourth_place: fourth,
    notes: JSON.stringify({ points: PLACE_POINTS, user_notes: notes }),
    created_at: new Date().toISOString()
  };
  const { error } = await db.from('sports_results').insert([payload]);
  if(error) { document.getElementById('resStatus').innerHTML = `<div class="alert alert-error">${esc(error.message)}</div>`; return; }
  showToast('Result saved!', 'success');
  await loadEvents();
  switchAdminTab('result');
}

function updateDesignerField(f, prop, value) {
  if(!certLayout[f]) return;
  if(prop === 'x' || prop === 'y') value = Math.max(0, Math.min(100, Number(value) || 0));
  certLayout[f][prop] = value;
  const el = document.getElementById('df-' + f);
  if(el) {
    el.style.left = certLayout[f].x + '%';
    el.style.top  = certLayout[f].y + '%';
    if(prop === 'size')  el.style.fontSize = value + 'px';
    if(prop === 'weight') el.style.fontWeight = value;
    if(prop === 'align') el.style.textAlign = value;
    if(prop === 'color') el.style.color = value;
  }
}

// ── DRAG HANDLING ──
function startDrag(e, field) {
  e.preventDefault();
  e.stopPropagation();
  designerActiveField = field;
  selectDesignerField(field);
  const canvas = document.getElementById('designerCanvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  designerCanvasRect = rect;
  designerDragging = { field, rect };
  const el = document.getElementById('df-' + field);
  if(el) el.classList.add('dragging');
}

function onDesignerMouseMove(e) {
  if(!designerDragging) return;
  moveDesignerField(e.clientX, e.clientY);
}

function onDesignerTouchMove(e) {
  if(!designerDragging) return;
  if(e.touches && e.touches[0]) {
    e.preventDefault();
    moveDesignerField(e.touches[0].clientX, e.touches[0].clientY);
  }
}

function moveDesignerField(clientX, clientY) {
  if(!designerDragging || !designerCanvasRect) return;
  const rect = designerCanvasRect;
  const xPct = ((clientX - rect.left) / rect.width) * 100;
  const yPct = ((clientY - rect.top) / rect.height) * 100;
  const x = Math.max(0, Math.min(100, +xPct.toFixed(2)));
  const y = Math.max(0, Math.min(100, +yPct.toFixed(2)));
  const f = designerDragging.field;
  certLayout[f].x = x;
  certLayout[f].y = y;
  const el = document.getElementById('df-' + f);
  if(el) { el.style.left = x + '%'; el.style.top = y + '%'; }
  // Update inputs if editing this field
  if(f === designerActiveField) {
    const inputs = document.querySelectorAll('#designerFieldControls input[type="number"]');
    if(inputs[0]) inputs[0].value = x;
    if(inputs[1]) inputs[1].value = y;
  }
}

function onDesignerMouseUp() {
  if(!designerDragging) return;
  const el = document.getElementById('df-' + designerDragging.field);
  if(el) el.classList.remove('dragging');
  designerDragging = null;
}

  if(res.error) {
    if(status) status.innerHTML = `<div class="alert alert-error">❌ Layout save failed: ${esc(res.error)}</div>`;
    return;

  showToast('✅ Layout saved to cloud! All devices will use it.', 'success');

}

function resetCertLayout() {
  if(!confirm('Reset all field positions to defaults? (You still need to click Save Layout to make it permanent.)')) return;
  certLayout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
  Object.keys(certLayout).forEach(f => {
    const el = document.getElementById('df-' + f);
    if(el) {
      const c = certLayout[f];
      el.style.left = c.x + '%';
      el.style.top = c.y + '%';
      el.style.fontSize = c.size + 'px';
      el.style.fontWeight = c.weight;
      el.style.textAlign = c.align;
      el.style.color = c.color;
    }
  });
  renderDesignerFieldControls();
  showToast('Layout reset (click Save Layout to persist)', 'info');

async function onCertTemplateUpload(input) {
  const file = input.files?.[0];
  if(!file) return;
  if(!/image\/(png|jpe?g)/.test(file.type)) {
    showToast('Please upload a JPG or PNG image', 'error');
    return;
  }
  const status = document.getElementById('certUploadStatus');
  status.innerHTML = `<div class="alert alert-info">Compressing and uploading to cloud…</div>`;

  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const rawDataUrl = ev.target.result;
      const compressed = await compressImageDataUrl(rawDataUrl, 1600, 0.85);
      const result = await saveCertSetting(CERT_KEY_IMAGE, compressed);
      if(result.error) {
        status.innerHTML = `<div class="alert alert-error">❌ Cloud save failed: ${esc(result.error)}</div>`;
        return;
      }
      const metaResult = await saveCertSetting(CERT_KEY_META, JSON.stringify({ name: file.name || 'certificate.jpg', uploaded_at: new Date().toISOString() }));
      certTemplateDataUrl = compressed;
      certTemplateName = file.name || 'certificate.jpg';
      status.innerHTML = `<div class="alert alert-success">✅ Image uploaded to cloud!</div>`;
      showToast('Certificate image saved to cloud', 'success');
      setTimeout(() => switchAdminTab('cert'), 700);
    } catch(e) {
      status.innerHTML = `<div class="alert alert-error">❌ ${esc(e.message)}</div>`;
    }
  };
  reader.onerror = () => showToast('Could not read the file', 'error');
  reader.readAsDataURL(file);
}

async function reloadCertTemplate() {
  showToast('Reloading from cloud…', 'info');
  await loadCertificateConfigFromCloud();
  switchAdminTab('cert');
}

async function clearCertTemplate() {
  if(!confirm('Remove the certificate image from cloud? Other devices will lose it too.')) return;
  if(db) {
    await db.from('sports_settings').delete().eq('key', CERT_KEY_IMAGE);
    await db.from('sports_settings').delete().eq('key', CERT_KEY_META);
  }
  certTemplateDataUrl = null;
  certTemplateName = '';
  showToast('Image removed from cloud', 'warning');
  switchAdminTab('cert');
}

async function renderCertificateCards() {

  const { data: participants } = await db.from('sports_participants').select('*').eq('event_id', eid);

    else if(thirdHouses.includes(h)) certEntries.push({ ...p, place: 'Third Place', medal: '🥉' });

  if(!certEntries.length) {

  }

  container.innerHTML = certEntries.map((e, i) => `

      <div class="name">${esc(e.student_name || '—')}</div>

  .sheet { width:794px; max-width:100%; position:relative; }

  .text { position:absolute; font-family: Georgia, 'Times New Roman', serif; line-height:1; }
  .toolbar { position:fixed; top:12px; right:12px; display:flex; gap:8px; z-index:10; }
  .toolbar button { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:600; }
  .print-btn { background:#0f8f86; color:#fff; }
  .close-btn { background:#e5e7eb; color:#111; }
  @media print {
    body { background:white; padding:0; }
    .toolbar { display:none; }
    .sheet { width:100%; max-width:100%; margin:0; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
    <button class="close-btn" onclick="window.close()">✕ Close</button>
  </div>
  <div class="sheet">
    ${bgImg}
    ${fieldsHtml}
  </div>
</body></html>`;
}

function openCertificate(index) {
  const entry = window.__certEntries?.[index];
  if(!entry) { showToast('Certificate data missing', 'error'); return; }
  const win = window.open('', '_blank', 'width=900,height=1100');
  if(!win) { showToast('Pop-up blocked. Please allow pop-ups.', 'error'); return; }
  win.document.open();
  win.document.write(buildCertificateHtml(entry));
  win.document.close();
  win.focus();
}

function printCertificateDirect(index) {
  const entry = window.__certEntries?.[index];
  if(!entry) { showToast('Certificate data missing', 'error'); return; }
  const win = window.open('', '_blank', 'width=900,height=1100');
  if(!win) { showToast('Pop-up blocked. Please allow pop-ups.', 'error'); return; }
  win.document.open();
  win.document.write(buildCertificateHtml(entry));
  win.document.close();
  win.focus();
  setTimeout(() => { try { win.print(); } catch(e){} }, 700);
}

    </div>

}
